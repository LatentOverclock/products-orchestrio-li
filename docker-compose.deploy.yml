services:
  backend:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-proxy"
      - "traefik.http.routers.products-api.rule=(Host(`${APP_HOST}`) || Host(`products.orchestio.li`)) && (PathPrefix(`/graphql`) || PathPrefix(`/health`))"
      - "traefik.http.routers.products-api.entrypoints=websecure"
      - "traefik.http.routers.products-api.priority=200"
      - "traefik.http.routers.products-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.products-api.loadbalancer.server.port=8080"
    networks:
      - default
      - edge-proxy

  frontend:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-proxy"
      - "traefik.http.routers.products-web.rule=Host(`${APP_HOST}`) || Host(`products.orchestio.li`)"
      - "traefik.http.routers.products-web.entrypoints=websecure"
      - "traefik.http.routers.products-web.priority=100"
      - "traefik.http.routers.products-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.products-web.loadbalancer.server.port=80"
    networks:
      - default
      - edge-proxy

networks:
  edge-proxy:
    external: true
